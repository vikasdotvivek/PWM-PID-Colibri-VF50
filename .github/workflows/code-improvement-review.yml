name: Code improvement triage
on:
  workflow_dispatch:
  push:
    branches: [review/code-improvements-2026-11-06]
    paths-ignore:
      - .review/STATIC_REVIEW.md
      - .review/static-review.json
permissions:
  contents: write
concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository_owner == 'vikasdotvivek' && github.ref == 'refs/heads/review/code-improvements-2026-11-06'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - uses: vikasdotvivek/PWM-PID-Colibri-VF50/.review@918dddc427ca61723cd10b878567c523e39b5612
      - name: Commit review findings without changing production source
        env:
          REVIEW_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REVIEW_BRANCH" = 'review/code-improvements-2026-11-06'
          git add -- .review/STATIC_REVIEW.md .review/static-review.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(review): record static improvement candidates'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
