name: Serial protocol tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/serial-protocol-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/serial-protocol-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/SerialProtocol.SelfTest.csproj --configuration Release
