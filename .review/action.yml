name: Read-only repository improvement triage
description: Inspect source without executing it and write explicit review candidates and scope.
runs:
  using: composite
  steps:
    - name: Test the reviewer
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        python3 -m unittest -v test_audit.py
    - name: Inspect tracked source without running repository code
      shell: bash
      env:
        REVIEW_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/audit.py" --root "$GITHUB_WORKSPACE" --repository "$REVIEW_REPOSITORY"
